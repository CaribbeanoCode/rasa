version: '3.8'

services:
  rasa:
    image: rasa/rasa:3.6.2-full
    container_name: rasa_server
    restart: unless-stopped
    ports:
      - "5005:5005"
    volumes:
      - ./:/app
      - rasa_models:/app/models
    command:
      - run
      - -m
      - models
      - --enable-api
      - --cors
      - "*"
    environment:
      - RASA_TELEMETRY_OPT_OUT=true

volumes:
  rasa_models:
